[workspace]
resolver = "3"
members = ["crates/*"]
# An embedder's crate, built on its own (ci/README.md, `embed`).
exclude = ["examples/embed"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ironflowx/foundation"
homepage = "https://github.com/ironflowx"
authors = ["Ironflow contributors"]

[workspace.dependencies]
ironflowx-core = { path = "crates/ironflowx-core", version = "0.2.0" }
ironflowx-events = { path = "crates/ironflowx-events", version = "0.2.0" }
ironflowx-proto = { path = "crates/ironflowx-proto", version = "0.2.0" }
ironflowx-cell = { path = "crates/ironflowx-cell", version = "0.2.0" }
ironflowx-authz = { path = "crates/ironflowx-authz", version = "0.2.0" }
ironflowx-store = { path = "crates/ironflowx-store", version = "0.2.0" }
ironflowx-operations = { path = "crates/ironflowx-operations", version = "0.2.0" }
# Parsing and validation only: no generation feature in the pure crates.
uuid = { version = "1.29.3", default-features = false, features = ["std"] }
# Event rules parse JSON with a visitor (D12); no derive, no preserve_order.
serde_core = { version = "1.0.229", default-features = false, features = ["std"] }
# Exact pin: the 127-depth rule relies on serde_json's internal recursion limit of 128.
# float_roundtrip: correctly rounded floats, so a number just past f64::MAX is out of range.
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
