[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ironflowx/foundation"
homepage = "https://github.com/ironflowx"
authors = ["Ironflow contributors"]

[workspace.dependencies]
ironflowx-core = { path = "crates/ironflowx-core", version = "0.0.1" }
# Parsing and validation only: no generation feature in the pure crates.
uuid = { version = "1.29.3", default-features = false, features = ["std"] }
# Event rules parse JSON with a visitor (D12); no derive, no preserve_order.
serde_core = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
