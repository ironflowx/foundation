name: Published v0.3.0 proof (#158)

on:
  push:
    branches: [proof/v0.3.0-issue-158]

permissions:
  contents: read

jobs:
  binary:
    name: Archive / ${{ matrix.platform }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86-64
            runner: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-musl
          - platform: Linux AArch64
            runner: ubuntu-24.04-arm
            machine: aarch64
            target: aarch64-unknown-linux-musl
          - platform: macOS Apple silicon
            runner: macos-26
            machine: arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the published archive and exercise its CLI
        env:
          MACHINE: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: bash .github/proof-158/archive.sh

  embed:
    name: Embed / crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and run the isolated published-crate example
        run: bash .github/proof-158/embed.sh
