name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Runs the crash-test soak (the `soak` job) alongside every other job, on the ref you pick.
  workflow_dispatch:
    inputs:
      kills:
        description: Seeded kills per platform
        type: number
        default: 10000

permissions:
  contents: read

concurrency:
  # The event in the key keeps a push to main from cancelling a soak running on main.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are the required status checks of the `main` ruleset. The toolchain comes from
# rust-toolchain.toml; only public-api uses the nightly pinned in ci/tools.env (D21).
# Build caches (Swatinem/rust-cache) are saved by main only and restored by PRs, so PR runs do
# not evict each other from the repository's cache quota.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: ci/comment-width.sh crates examples ci/*.sh
      - name: comment-width rejects its fixture and passes the exempt cases
        run: |
          ci/must-reject.sh \
            "ci/fixtures/comment-width/long.sh:3:" \
            "ci/fixtures/comment-width/long.rs:3:" \
            "ci/fixtures/comment-width/long.rs:4:" \
            "ci/fixtures/comment-width/long.rs:5: 101 columns" -- \
            ci/comment-width.sh ci/fixtures/comment-width
          ci/comment-width.sh ci/fixtures/comment-width-ok

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # SRV-14: protox compiles the proto; nothing calls protoc or buf.
      - run: ci/no-protoc.sh cargo build --workspace --all-targets --locked
      - name: no-protoc rejects its fixture, which builds where there is a protoc and a buf
        run: |
          needs="$PWD/ci/fixtures/needs-protoc"
          export PATH="$needs/has-protoc:$needs/has-buf:$PATH"
          export PROTOC="$needs/has-protoc/protoc" BUF="$needs/has-buf/buf"
          cargo build --locked --manifest-path ci/fixtures/needs-protoc/Cargo.toml
          ci/must-reject.sh "protoc did not run" "buf did not run" -- \
            ci/no-protoc.sh cargo build --locked --manifest-path ci/fixtures/needs-protoc/Cargo.toml

  # A separate job, not a matrix, so the required `clippy` check keeps its name.
  clippy-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The crash test's seeded kills, pinned so the budget docs/invariants.md states is the one CI runs; the named fault points always run.
    env:
      CRASH_KILLS: 100
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      # Isolate the facade from the features the rest of the workspace switches on.
      - run: cargo test -p ironflowx --locked --test features
        env:
          IRONFLOWX_FACADE_FEATURES: none
      - name: Facade defaults build without the HTTP stack
        run: |
          ci/no-facade-http.sh
          ci/must-reject.sh "dependency 'connectrpc'" "dependency 'http'" "dependency 'hyper'" \
            "dependency 'hyper-util'" "dependency 'rustls'" "dependency 'rustls-native-certs'" -- \
            ci/no-facade-http.sh --features client-tls
      - run: cargo test -p ironflowx --locked --features client --test features --example whoami
        env:
          IRONFLOWX_FACADE_FEATURES: client
      - run: cargo test -p ironflowx --locked --features client-tls --test features --example whoami
        env:
          IRONFLOWX_FACADE_FEATURES: client-tls
      # Without `client-tls`, an `https` URL is no client's.
      - run: cargo test -p ironflowx-proto --locked --test client
        env:
          NO_CLIENT_TLS: 1
      # Feature unification can switch rustls's other provider on in any embedder's build; it then has no default.
      - run: cargo test -p ironflowx-proto --locked --test client --features client-tls,rustls/ring
      # Feature unification can switch arbitrary_precision on in any embedder's build; numbers then reach the event rules' visitor as text, and a Value takes an object for a number.
      - run: cargo test -p ironflowx-events --locked --features serde_json/arbitrary_precision

  # deny.toml lists the Linux and macOS targets, so one run covers both.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -v '^#' ci/tools.env >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY }}
      - run: cargo deny check

  # LED-15, D17 and the crash test's fault points; see ci/README.md.
  purity:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/purity.sh

  # A pure crate builds for WASM: a dependency or a cfg without wasm support fails it. The bans
  # on threads, the clock and the filesystem are purity's clippy.toml.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One crate a run, so no other crate's features build it.
      - run: |
          for crate in ironflowx-core ironflowx-events ironflowx-authz; do
            cargo check --locked --target wasm32-unknown-unknown -p "$crate"
          done

  # ironflowx/ironflow's suite (its binary and CLI) against this checkout, through the [patch] its
  # ci/conformance.sh writes: a change here that breaks the app fails before it merges.
  conformance:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Its code runs here: no token left in either checkout. Depth 2 keeps the PR merge commit's
      # first parent, the base, for the diff below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      # A PR that changes only docs/ and Markdown passes without the suite. The steps are skipped,
      # not the job: a skipped job would pass every PR, and check-required.sh rejects one.
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD | awk '!/^docs\// && !/\.md$/ { n++ } END { exit !n }'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "conformance: the PR changes only docs/ and Markdown; the suite is skipped"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: ironflowx/ironflow
          ref: main
          path: ironflow
          persist-credentials: false
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ironflow -> target/conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.scope.outputs.run == 'true'
        run: ironflow/ci/conformance.sh "$GITHUB_WORKSPACE"

  # The PRD's last "Done when": a crate outside the workspace, on `ironflowx` and `tokio` only,
  # bootstraps an engine with a seed, emits, reads with a `read` key and sees its emit refused, then
  # restarts it and reads with the seed. Its .cargo/config.toml patches `ironflowx` to this checkout.
  embed:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/embed
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/embed
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo run --locked

  # D21, LED-6, LED-9, LED-13: any public API change is a reviewed snapshot change.
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -v '^#' ci/tools.env >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@${{ env.CARGO_PUBLIC_API }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/public-api.sh

  # D16: docs name only the segment-log version Cargo.toml pins.
  doc-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ci/doc-pins.sh

  # The workflow and ci/ scripts: a shell mistake here makes a check pass without checking.
  lint-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: grep -v '^#' ci/tools.env >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@${{ env.SHELLCHECK }}
      # install-action has no actionlint manifest; go install checks the module against sum.golang.org.
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT"
      - run: '"$(go env GOPATH)/bin/actionlint"'
      - run: shellcheck -x ci/*.sh .githooks/*
      - run: ci/required-checks.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Outside contributions are refused: a PR must come from a branch of this repository, opened by
  # a maintainer or Dependabot. The step, not the job, is conditional, so the check cannot skip.
  maintainer-only:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          [ "$HEAD" = "$GITHUB_REPOSITORY" ] || { echo "::error::opened from a fork: $HEAD"; exit 1; }
          case "$AUTHOR:$ASSOC" in
            *:OWNER | *:MEMBER | *:COLLABORATOR | 'dependabot[bot]':*) ;;
            *) echo "::error::$AUTHOR ($ASSOC) is not a maintainer"; exit 1 ;;
          esac

  # The longer crash-test soak run by hand before publishing (docs/invariants.md); not a required check.
  # The server crash soak is ironflowx/ironflow's, with the binary.
  soak:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CRASH_KILLS: ${{ inputs.kills }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test -p ironflowx-crash-test --locked --test crash seeded_random_kills
