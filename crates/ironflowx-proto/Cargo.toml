[package]
name = "ironflowx-proto"
description = "The Ironflow X Operations interface and its request and answer types."
keywords = ["ironflowx", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# The generated wire messages and their mapping. They name buffa's and connectrpc's types and follow
# their 0.x versions, so public-api/ leaves them out.
wire = ["__wire"]
# `wire`, and the generated service traits a door implements.
server = ["wire"]
# The proto client. It names no dependency's type.
client = ["__wire", "connectrpc/client", "dep:hyper-util"]
# `client`, calling `https` URLs too. It trusts the roots of the system's store.
client-tls = ["client", "connectrpc/client-tls", "dep:rustls", "dep:rustls-native-certs"]
# Internal: what the three above share.
__wire = [
  "dep:base64",
  "dep:buffa",
  "dep:buffa-types",
  "dep:connectrpc",
  "dep:connectrpc-build",
  "dep:http",
  "dep:protox",
  "dep:serde",
]

[dependencies]
ironflowx-core.workspace = true
base64 = { version = "0.22.1", default-features = false, features = ["alloc"], optional = true }
buffa = { version = "0.9.2", default-features = false, features = ["std", "json"], optional = true }
buffa-types = { version = "0.9.2", default-features = false, features = ["std", "json"], optional = true }
# No default features: no gzip and no zstd.
connectrpc = { version = "0.9.1", default-features = false, features = ["json"], optional = true }
http = { version = "1.5.0", default-features = false, features = ["std"], optional = true }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"], optional = true }

[build-dependencies]
connectrpc-build = { version = "0.9.0", optional = true }
protox = { version = "0.10.0", default-features = false, optional = true }

[dev-dependencies]
# For tests/wire.rs; a dev-dependency does not ship.
ironflowx-proto = { path = ".", features = ["server", "client"] }
prost-reflect = "0.16.5"
serde_json = "1.0.149"
