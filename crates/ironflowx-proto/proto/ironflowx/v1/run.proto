syntax = "proto3";

package ironflowx.v1;

import "google/protobuf/timestamp.proto";
import "ironflowx/v1/options.proto";

// The runs of the calling key's environment: durable invocations of its functions.
service RunService {
  // Starts a run of a function, queued and due at once.
  rpc StartRun(StartRunRequest) returns (StartRunResponse) {
    option (ironflowx.v1.cli) = "runs start";
    option (ironflowx.v1.summary) =
      "Start a run of a function, queued and due at once. Sent again it starts a second run";
    option (ironflowx.v1.example) = "{\"function\": \"refund\"}";
  }
  // Reads one run by ID.
  rpc GetRun(GetRunRequest) returns (Run) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (ironflowx.v1.cli) = "runs get";
    option (ironflowx.v1.summary) = "Read one run by its ID: its status, steps, lease and output";
    option (ironflowx.v1.example) = "{\"run_id\": \"0190b5f0-0000-7000-8000-000000000001\"}";
  }
}

message StartRunRequest {
  string function = 1;
}

message StartRunResponse {
  string run_id = 1 [json_name = "run_id"];
  // Whether a start key matched an earlier run, whose ID this is.
  bool duplicate = 2;
}

message GetRunRequest {
  string run_id = 1 [json_name = "run_id"];
}

// A run.
message Run {
  string run_id = 1 [json_name = "run_id"];
  string function = 2;
  // The function's code label when the run was created.
  string code = 3;
  // "queued", "running", "completed", "failed".
  string status = 4;
  // The run's input, JSON text.
  optional string input = 5 [(ironflowx.v1.json_text) = true];
  google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
  // "key:<key ID>", or "embedder:<name>".
  string created_by = 7 [json_name = "created_by"];
  // While queued.
  optional google.protobuf.Timestamp due_at = 8 [json_name = "due_at"];
  // The current execution's number; 0 before the first claim.
  uint32 execution = 9;
  // While running.
  optional google.protobuf.Timestamp lease_until = 10 [json_name = "lease_until"];
  // How many steps have been begun.
  uint32 steps = 11;
  // The open step's name, if one is open.
  optional string step = 12;
  // The run's output, JSON text, once completed.
  optional string output = 13 [(ironflowx.v1.json_text) = true];
  optional google.protobuf.Timestamp ended_at = 14 [json_name = "ended_at"];
  // Leases lost in a row without progress; the tenth fails the run.
  uint32 lost_leases = 15 [json_name = "lost_leases"];
  // The last error, once one is recorded.
  RunError error = 16;
}

// A run's error. A code that begins with "ironflowx." is the engine's own.
message RunError {
  string code = 1;
  string message = 2;
}

// A run that has ended, as an answer names it.
message RunEnd {
  string run_id = 1 [json_name = "run_id"];
  // "completed", "failed".
  string status = 2;
}
