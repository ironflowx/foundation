[package]
name = "ironflowx-cell"
description = "The Ironflow X ledger: one environment's durable commit log and read store."
keywords = ["ironflowx", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Internal and unstable, not part of the API: test hooks that hold the fold, inject an
# append or fold fault, which can make a durable commit answer `Unknown`, and call a hook at
# each named fault point (the hook lives in ironflowx-core). For this repo's tests only;
# ci/no-fault-points.sh fails if a published build can enable it any other way.
__fault-points = ["ironflowx-core/__fault-points"]

[dependencies]
ironflowx-core.workspace = true
ironflowx-events.workspace = true
getrandom = { version = "0.4.3", default-features = false }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "fallible_uint"] }
# D16: an exact version, from crates.io.
segment-log-core = "=0.3.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time"] }

# A lossy `as` wrapped a cursor sequence into an empty page once; casts here go through
# `try_from`, or carry a commented `#[expect]`.
[lints.clippy]
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
