[package]
name = "ironflowx-doors"
description = "The doors an Ironflow X engine is called through, HTTP first."
keywords = ["ironflowx", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-doors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# The HTTP door.
http = ["dep:axum", "dep:connectrpc", "dep:http", "dep:tracing", "ironflowx-proto/server"]

# No engine crate: ci/no-engine-deps.sh (SRV-1).
[dependencies]
ironflowx-core.workspace = true
ironflowx-proto.workspace = true
axum = { version = "0.8.9", default-features = false, optional = true }
connectrpc = { version = "0.9.1", default-features = false, features = ["json"], optional = true }
http = { version = "1.5.0", default-features = false, features = ["std"], optional = true }

tracing = { version = "0.1.44", default-features = false, optional = true }

[dev-dependencies]
# For the tests; a dev-dependency does not ship.
ironflowx-doors = { path = ".", features = ["http"] }
ironflowx-proto = { workspace = true, features = ["client"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
buffa = { version = "0.9.2", default-features = false }
connectrpc = { version = "0.9.1", default-features = false, features = ["client"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread"] }
