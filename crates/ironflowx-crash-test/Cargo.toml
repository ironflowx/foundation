[package]
name = "ironflowx-crash-test"
description = "Kills a process that owns an engine at named fault points and checks what survives (#6). Unpublished."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ironflowx-core.workspace = true
ironflowx-cell = { workspace = true, features = ["__fault-points"] }
ironflowx-operations = { workspace = true, features = ["__fault-points"] }
ironflowx-proto.workspace = true
ironflowx-store = { workspace = true, features = ["__fault-points"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
ironflowx-authz.workspace = true
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
tempfile = "3.27.0"
