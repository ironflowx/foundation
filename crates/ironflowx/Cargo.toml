[package]
name = "ironflowx"
description = "Ironflow X foundation crates in one dependency."
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
client = ["ironflowx-proto/client"]
client-tls = ["client", "ironflowx-proto/client-tls"]

[dependencies]
ironflowx-core.workspace = true
ironflowx-proto.workspace = true
ironflowx-cell.workspace = true
ironflowx-operations.workspace = true

[dev-dependencies]
# The runtime for examples/whoami.rs. The proto client supplies the I/O and timer features.
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

[[example]]
name = "whoami"
required-features = ["client"]
