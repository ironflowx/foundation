[package]
name = "ironflowx-operations"
description = "The Ironflow X engine: admits every call against the control plane, then runs it on the environment's ledger or its keys."
keywords = ["ironflow", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Internal and unstable, not part of the API: calls the crash test's hook in ironflowx-core at each
# named fault point (D23). ci/no-fault-points.sh fails if a published build can enable it any
# other way.
__fault-points = ["ironflowx-core/__fault-points"]

[dependencies]
ironflowx-authz.workspace = true
ironflowx-cell.workspace = true
ironflowx-core.workspace = true
ironflowx-events.workspace = true
ironflowx-proto.workspace = true
ironflowx-store.workspace = true
getrandom = { version = "0.4.3", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# For tests/unknown.rs, and tests/secrets.rs's key hook; a dev-dependency does not ship
# (ci/no-fault-points.sh).
ironflowx-operations = { path = ".", features = ["__fault-points"] }
ironflowx-core = { workspace = true, features = ["__fault-points"] }
ironflowx-cell = { workspace = true, features = ["__fault-points"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
