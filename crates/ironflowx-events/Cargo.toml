[package]
name = "ironflowx-events"
description = "Ironflow X event rules: what an event is and when an emit is refused."
keywords = ["ironflow", "workflow", "event-driven"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ironflowx-core.workspace = true
serde_core.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests run with serde_json's arbitrary_precision on, as feature unification can switch it on in
# any build; numbers then reach the visitor as text. The normal build does not see it.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
