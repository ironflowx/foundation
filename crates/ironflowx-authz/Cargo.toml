[package]
name = "ironflowx-authz"
description = "Ironflow X credentials: the key format, its digest, and whether a key is valid. Pure."
keywords = ["ironflow", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-authz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
ironflowx-core.workspace = true
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
