[package]
name = "ironflowx-store"
description = "The Ironflow X control plane: which tenants, projects, environments and keys exist."
keywords = ["ironflowx", "workflow", "event-driven"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Internal and unstable, not part of the API: calls the crash test's hook in ironflowx-core at each
# named fault point (D23). ci/no-fault-points.sh fails if a published build can enable it any
# other way.
__fault-points = ["ironflowx-core/__fault-points"]

[dependencies]
ironflowx-authz.workspace = true
ironflowx-core.workspace = true
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "fallible_uint"] }

[dev-dependencies]
ironflowx-authz = { workspace = true, features = ["__count-ct-eq"] }
tempfile = "3.27.0"
