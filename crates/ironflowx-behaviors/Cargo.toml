[package]
name = "ironflowx-behaviors"
description = "Runs the behavior scenarios in docs/behaviors/ against the engine and its door (D20). Unpublished."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
ironflowx-core.workspace = true
ironflowx-cell.workspace = true
ironflowx-events.workspace = true
ironflowx-operations.workspace = true
ironflowx-doors = { workspace = true, features = ["http"] }
ironflowx-proto = { workspace = true, features = ["client"] }
serde_json.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
cucumber = "0.23.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net"] }
futures = { version = "0.3.34", default-features = false }

[[test]]
name = "behaviors"
harness = false
