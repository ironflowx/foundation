  { path = "std::net::TcpListener", reason = "pure crates do no I/O" },
  { path = "std::net::TcpStream", reason = "pure crates do no I/O" },
  { path = "std::net::UdpSocket", reason = "pure crates do no I/O" },
  { path = "std::os::unix::net::UnixDatagram", reason = "pure crates do no I/O" },
  { path = "std::os::unix::net::UnixListener", reason = "pure crates do no I/O" },
  { path = "std::os::unix::net::UnixStream", reason = "pure crates do no I/O" },
  { path = "std::process::Command", reason = "pure crates do no I/O" },
  { path = "std::thread::Builder", reason = "pure crates start no threads" },
]
