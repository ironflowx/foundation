[package]
name = "ironflowx-core"
description = "Ironflow X core types: validated opaque IDs, the environment reference, attribution, stored and event-clock time, the clock trait and the error kinds."
keywords = ["ironflow", "workflow", "event-driven"]
categories = ["data-structures"]
readme = "../../README.md"
documentation = "https://docs.rs/ironflowx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
# Internal and unstable, not part of the API: the crash test's hooks (D23), called at each
# named fault point and before a key is stored. A crate that reaches a point forwards its own `__fault-points` to this one;
# ci/no-fault-points.sh fails if a published build can enable it any other way.
__fault-points = []

[dependencies]
uuid.workspace = true
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_core.workspace = true
