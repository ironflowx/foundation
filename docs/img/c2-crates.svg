<svg width="860" height="500" viewBox="0 0 860 500" role="img" aria-label="C2: crates inside the host's or embedder's process. The host calls Operations, the trait and messages in ironflowx-proto, on the engine in ironflowx-operations. The engine uses ironflowx-authz, the pure credentials, ironflowx-events, the pure event rules, ironflowx-store, the control plane, and ironflowx-cell, the ledger. An embedder that needs no keys calls the ledger directly. The control plane uses the credentials. The ledger uses ironflowx-events too. ironflowx-core is used by every ironflowx crate, and the ironflowx facade re-exports core, proto, cell and operations. The ledger writes through segment-log-core and rusqlite, and the control plane through rusqlite, to disk." xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" fill="currentColor">
  <style>svg{color:#1b1b1b}.bg{fill:#ffffff}.band{fill:#f3f5f8}.pure{fill:#e8f1fb}.lib{fill:#f6efe6}.sub{opacity:.75}@media (prefers-color-scheme:dark){svg{color:#e6e6e6}.bg{fill:#16181d}.band{fill:#1f232b}.pure{fill:#18283a}.lib{fill:#2b241b}}</style>
  <rect class="bg" width="860" height="500" rx="8"/>
  <defs><marker id="a-c2-crates" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="600" text-anchor="start">C2 · Crates in the host's or embedder's process</text>
  <rect class="band" x="20" y="44" width="820" height="414" rx="8"/>
  <text x="34" y="64" font-size="11" font-weight="600" text-anchor="start">one process</text>
  <rect x="60" y="76" width="200" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">Host / embedder</text>
  <text x="160.0" y="111.0" text-anchor="middle" font-size="11">call Operations</text>
  <rect x="320" y="76" width="220" height="48" rx="5" fill="none" stroke="#2f7fd1" stroke-width="2"/>
  <text x="430.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-proto</text>
  <text x="430.0" y="111.0" text-anchor="middle" font-size="11">Operations trait and messages</text>
  <rect x="600" y="76" width="210" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="705.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx (facade)</text>
  <text x="705.0" y="111.0" text-anchor="middle" font-size="11">re-exports what apps use</text>
  <rect x="60" y="170" width="200" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="160.0" y="193.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-operations</text>
  <text x="160.0" y="208.0" text-anchor="middle" font-size="11">Engine: admits every call</text>
  <rect class="pure" x="320" y="170" width="220" height="54" rx="5"/>
  <rect x="320" y="170" width="220" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="193.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-authz</text>
  <text x="430.0" y="208.0" text-anchor="middle" font-size="11">credentials: key format, verify</text>
  <rect x="600" y="170" width="210" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="705.0" y="193.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-store</text>
  <text x="705.0" y="208.0" text-anchor="middle" font-size="11">control plane: who and what exists</text>
  <rect x="60" y="272" width="200" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="160.0" y="295.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-cell</text>
  <text x="160.0" y="310.0" text-anchor="middle" font-size="11">Ledger</text>
  <rect class="pure" x="320" y="272" width="220" height="54" rx="5"/>
  <rect x="320" y="272" width="220" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="295.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-events</text>
  <text x="430.0" y="310.0" text-anchor="middle" font-size="11">event rules: decide, fold, queries</text>
  <rect class="pure" x="600" y="272" width="210" height="54" rx="5"/>
  <rect x="600" y="272" width="210" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="705.0" y="287.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-core</text>
  <text x="705.0" y="302.0" text-anchor="middle" font-size="11">IDs, EnvRef, times, Clock, errors</text>
  <text x="705.0" y="317.0" text-anchor="middle" font-size="11">used by every ironflowx crate</text>
  <rect class="lib" x="60" y="384" width="200" height="50" rx="5"/>
  <rect x="60" y="384" width="200" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="160.0" y="405.0" text-anchor="middle" font-size="13" font-weight="600">segment-log-core</text>
  <text x="160.0" y="420.0" text-anchor="middle" font-size="11">commit log (library)</text>
  <rect class="lib" x="320" y="384" width="220" height="50" rx="5"/>
  <rect x="320" y="384" width="220" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="405.0" text-anchor="middle" font-size="13" font-weight="600">rusqlite</text>
  <text x="430.0" y="420.0" text-anchor="middle" font-size="11">SQLite, bundled (library)</text>
  <rect x="600" y="384" width="210" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705.0" y="405.0" text-anchor="middle" font-size="13" font-weight="600">disk</text>
  <text x="705.0" y="420.0" text-anchor="middle" font-size="11">log, read.db, control.db</text>
  <path d="M260 100 H318" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 124 V168" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <text x="166" y="150" font-size="11" text-anchor="start">opens, calls</text>
  <path d="M240 170 L350 126" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M260 197 H318" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M600 197 H542" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M230 224 V246 H705 V226" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M245 224 L360 270" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 224 V270" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M60 100 H42 V299 H58" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <text x="50" y="262" font-size="11" text-anchor="start">without keys</text>
  <path d="M260 299 H318" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M540 299 H598" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 326 V382" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M240 326 L370 382" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M810 197 H826 V358 H470 V382" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M540 409 H598" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 434 V448 H705 V436" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <text x="20" y="482" font-size="11" text-anchor="start">Arrows point to what a crate depends on. Blue: the Operations seam. Shaded blue: pure crates, no I/O and no clock (layering check). Beige: libraries.</text>
</svg>
