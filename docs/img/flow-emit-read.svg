<svg width="1000" height="666" viewBox="0 0 1000 666" role="img" aria-label="Sequence: emit, then read your write. The client submits an emit to the writer; the writer asks the event rules to decide; a refusal or duplicate is answered at once with nothing appended. Otherwise the writer appends the submit and fsyncs, gets position p, publishes head p + 1 to the read gate, and acknowledges Committed with the outcome. The fold applies the record at p in one transaction. A read from any client snapshots the head on arrival, waits at the read gate until it is applied, then queries the read store and returns the event." xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" fill="currentColor">
  <style>svg{color:#1b1b1b}.bg{fill:#ffffff}.band{fill:#f3f5f8}.pure{fill:#e8f1fb}.lib{fill:#f6efe6}@media (prefers-color-scheme:dark){svg{color:#e6e6e6}.bg{fill:#16181d}.band{fill:#1f232b}.pure{fill:#18283a}.lib{fill:#2b241b}}</style>
  <rect class="bg" width="1000" height="666" rx="8"/>
  <defs><marker id="a-flow-emit-read" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="600" text-anchor="start">Flow · emit, then read your write</text>
  <rect x="15" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="90.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Client (adapter)</text>
  <path d="M90 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="185" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="260.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Writer</text>
  <path d="M260 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="355" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Event rules</text>
  <path d="M430 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="525" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="600.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Commit log</text>
  <path d="M600 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="695" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="770.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Fold · read store</text>
  <path d="M770 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="845" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="920.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Read gate</text>
  <path d="M920 78 V620" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M90 110 H254" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="175.0" y="104" font-size="11" text-anchor="middle">submit(Emit { data JSON, key })</text>
  <path d="M260 145 H424" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="345.0" y="139" font-size="11" text-anchor="middle">decide(view, sub, now, fresh)</text>
  <path d="M430 180 H266" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)" stroke-dasharray="5 3"/>
  <text x="345.0" y="174" font-size="11" text-anchor="middle">record | refusal | duplicate(id)</text>
  <rect class="band" x="20" y="192" width="320" height="36" rx="4"/>
  <rect x="20" y="192" width="320" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="28" y="207" font-size="11" text-anchor="start">refusal or duplicate: answer now,</text>
  <text x="28" y="222" font-size="11" text-anchor="start">nothing appended; head unchanged (EVT-030, EVT-061)</text>
  <path d="M260 262 H594" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="430.0" y="256" font-size="11" text-anchor="middle">append(submit bytes) + fsync</text>
  <path d="M600 296 H266" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)" stroke-dasharray="5 3"/>
  <text x="430.0" y="290" font-size="11" text-anchor="middle">position p</text>
  <path d="M266 310 H914" stroke="#2e9e6b" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="700" y="305" font-size="11" text-anchor="middle" fill="#2e9e6b">head = p + 1</text>
  <path d="M260 330 H96" stroke="#2e9e6b" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)" stroke-dasharray="5 3"/>
  <text x="175.0" y="324" font-size="11" text-anchor="middle" fill="#2e9e6b">Committed { outcome }   ← ack</text>
  <path d="M260 364 H764" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="515.0" y="358" font-size="11" text-anchor="middle">record at p, after the ack</text>
  <rect class="band" x="700" y="376" width="150" height="36" rx="4"/>
  <rect x="700" y="376" width="150" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="708" y="391" font-size="11" text-anchor="start">one txn: rows +</text>
  <text x="708" y="406" font-size="11" text-anchor="start">applied = p + 1</text>
  <path d="M90 450 H914" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="505.0" y="444" font-size="11" text-anchor="middle">read(get_event(id)), any client</text>
  <rect class="band" x="840" y="462" width="140" height="36" rx="4"/>
  <rect x="840" y="462" width="140" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="848" y="477" font-size="11" text-anchor="start">head h ≥ p + 1; waits</text>
  <text x="848" y="492" font-size="11" text-anchor="start">until applied ≥ h</text>
  <path d="M770 524 H914" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)" stroke-dasharray="5 3"/>
  <text x="845.0" y="518" font-size="11" text-anchor="middle">applied p + 1</text>
  <path d="M920 558 H776" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)"/>
  <text x="845.0" y="552" font-size="11" text-anchor="middle">query</text>
  <path d="M920 592 H96" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-emit-read)" stroke-dasharray="5 3"/>
  <text x="505.0" y="586" font-size="11" text-anchor="middle">the event (EVT-060)</text>
  <text x="20" y="650" font-size="11" text-anchor="start">Green: the acknowledgment, which follows fsync. The head is published first, so a read from any client waits for every acknowledged write.</text>
</svg>
