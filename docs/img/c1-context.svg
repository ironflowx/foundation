<svg width="600" height="410" viewBox="0 0 600 410" role="img" aria-label="C1 system context. A host or embedder, a Rust program or test, links Ironflow X foundation: the engine, which admits every call, and the ledger, which commits and reads one environment's events in process. They write to local disk. The behaviors suite drives the engine through Operations, in process or over the network. The ironflowx binary is a host that serves the engine over HTTP, and a CLI that calls one." xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" fill="currentColor">
  <style>svg{color:#1b1b1b}.bg{fill:#ffffff}.band{fill:#f3f5f8}.pure{fill:#e8f1fb}.lib{fill:#f6efe6}@media (prefers-color-scheme:dark){svg{color:#e6e6e6}.bg{fill:#16181d}.band{fill:#1f232b}.pure{fill:#18283a}.lib{fill:#2b241b}}</style>
  <rect class="bg" width="600" height="410" rx="8"/>
  <defs><marker id="a-c1-context" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="600" text-anchor="start">C1 · System context</text>
  <rect x="40" y="150" width="200" height="64" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="140.0" y="173.0" text-anchor="middle" font-size="13" font-weight="600">Host or embedder</text>
  <text x="140.0" y="189.0" text-anchor="middle" font-size="11">a Rust program or test</text>
  <text x="140.0" y="203.0" text-anchor="middle" font-size="11">an embedder uses no keys</text>
  <rect x="320" y="60" width="220" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430.0" y="80.0" text-anchor="middle" font-size="13" font-weight="600">Behaviors suite</text>
  <text x="430.0" y="96.0" text-anchor="middle" font-size="11">steps over Operations</text>
  <rect class="band" x="300" y="140" width="260" height="90" rx="8"/>
  <rect x="300" y="140" width="260" height="90" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="430.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600">Ironflow X foundation</text>
  <text x="430.0" y="192.0" text-anchor="middle" font-size="11">the engine: admits every call; the ledger:</text>
  <text x="430.0" y="206.0" text-anchor="middle" font-size="11">one environment's events, in process</text>
  <rect class="lib" x="330" y="300" width="200" height="54" rx="5"/>
  <rect x="330" y="300" width="200" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="325.0" text-anchor="middle" font-size="13" font-weight="600">Local disk</text>
  <text x="430.0" y="341.0" text-anchor="middle" font-size="11">segment log, read store, control plane</text>
  <path d="M240 182 H298" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c1-context)"/>
  <text x="246" y="174" font-size="11" text-anchor="start">links</text>
  <path d="M430 104 V138" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c1-context)"/>
  <text x="436" y="126" font-size="11" text-anchor="start">in process, or over the network</text>
  <path d="M430 230 V298" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c1-context)"/>
  <text x="436" y="270" font-size="11" text-anchor="start">fsync before ack</text>
  <text x="20" y="392" font-size="11" text-anchor="start">Dashed: outside foundation. The ironflowx binary is a host that serves over HTTP, and a CLI.</text>
</svg>
