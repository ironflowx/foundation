<svg width="1000" height="606" viewBox="0 0 1000 606" role="img" aria-label="Sequence: open after a crash. The embedder opens the ledger with a directory, an EnvRef and a clock. The ledger locks the directory, opens the commit log and reads the genesis record, refusing to open if its environment, token or format differs. It reads the applied position from the read store, rebuilding the read store if it is missing, unreadable, or disagrees with the log history. It refuses a matching store ahead of the log, or an empty log with recorded progress in any store. It reads the records after the applied position, refuses one with a foreign token or format, and folds each one with the event rules, writing rows and the new applied position in one transaction. It sets the next sequence and the event clock, then reports ready. When an append returns Indeterminate or the log poisons, the writer answers Unknown or Unavailable, rolls back its pending view and refuses every call until the ledger is reopened." xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" fill="currentColor">
  <style>svg{color:#1b1b1b}.bg{fill:#ffffff}.band{fill:#f3f5f8}.pure{fill:#e8f1fb}.lib{fill:#f6efe6}@media (prefers-color-scheme:dark){svg{color:#e6e6e6}.bg{fill:#16181d}.band{fill:#1f232b}.pure{fill:#18283a}.lib{fill:#2b241b}}</style>
  <rect class="bg" width="1000" height="606" rx="8"/>
  <defs><marker id="a-flow-restart" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="600" text-anchor="start">Flow · open after a crash, and a failed append</text>
  <rect x="15" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="90.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Embedder</text>
  <path d="M90 78 V560" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="195" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="270.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Ledger (recovery)</text>
  <path d="M270 78 V560" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="375" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="450.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Read store</text>
  <path d="M450 78 V560" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="555" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="630.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Commit log</text>
  <path d="M630 78 V560" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="735" y="44" width="150" height="34" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="810.0" y="65.0" text-anchor="middle" font-size="12" font-weight="600">Event rules</text>
  <path d="M810 78 V560" stroke="currentColor" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M90 110 H264" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="180.0" y="104" font-size="11" text-anchor="middle">open(dir, EnvRef, Clock)</text>
  <path d="M270 145 H624" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="450.0" y="139" font-size="11" text-anchor="middle">lock ledger · open log · read genesis</text>
  <path d="M630 180 H276" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)" stroke-dasharray="5 3"/>
  <text x="450.0" y="174" font-size="11" text-anchor="middle">genesis: env, token, format</text>
  <rect class="band" x="190" y="192" width="330" height="22" rx="4"/>
  <rect x="190" y="192" width="330" height="22" rx="4" fill="none" stroke="#c8553d" stroke-width="1"/>
  <text x="198" y="207" font-size="11" text-anchor="start" fill="#c8553d">genesis ≠ EnvRef, or format differs → refuse</text>
  <path d="M270 250 H444" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="360.0" y="244" font-size="11" text-anchor="middle">meta: applied a (rebuild if bad)</text>
  <rect x="180" y="264" width="710" height="92" rx="4" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="280" y="278" font-size="11" font-weight="600" text-anchor="start">for each record r from a, read from the log</text>
  <path d="M270 300 H804" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="540.0" y="294" font-size="11" text-anchor="middle">r.token and r.format match, else refuse · fold(r)</text>
  <path d="M270 340 H444" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="360.0" y="334" font-size="11" text-anchor="middle">rows + applied = r.position, one txn</text>
  <rect class="band" x="190" y="368" width="330" height="36" rx="4"/>
  <rect x="190" y="368" width="330" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="1"/>
  <text x="198" y="383" font-size="11" text-anchor="start">next sequence = last event + 1</text>
  <text x="198" y="398" font-size="11" text-anchor="start">event clock = max(last committed, clock)</text>
  <path d="M270 430 H96" stroke="#2e9e6b" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)" stroke-dasharray="5 3"/>
  <text x="180.0" y="424" font-size="11" text-anchor="middle" fill="#2e9e6b">ready</text>
  <path d="M20 452 H980" stroke="currentColor" stroke-width="1.2" fill="none" stroke-dasharray="2 4"/>
  <text x="20" y="472" font-size="12" font-weight="600" text-anchor="start">When an append fails</text>
  <path d="M270 500 H624" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)"/>
  <text x="450.0" y="494" font-size="11" text-anchor="middle">append(submit) + fsync</text>
  <path d="M630 530 H276" stroke="#c8553d" stroke-width="1.3" fill="none" marker-end="url(#a-flow-restart)" stroke-dasharray="5 3"/>
  <text x="450.0" y="524" font-size="11" text-anchor="middle" fill="#c8553d">Indeterminate | poisoned</text>
  <rect class="band" x="190" y="540" width="430" height="22" rx="4"/>
  <rect x="190" y="540" width="430" height="22" rx="4" fill="none" stroke="#c8553d" stroke-width="1"/>
  <text x="198" y="555" font-size="11" text-anchor="start" fill="#c8553d">answer Unknown | Unavailable; roll back; refuse all until reopened</text>
  <text x="20" y="592" font-size="11" text-anchor="start">Reopening runs the flow above. Nothing acknowledged is lost: an ack follows fsync, and recovery folds every record after the applied position.</text>
</svg>
