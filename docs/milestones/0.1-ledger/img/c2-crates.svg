<svg width="860" height="416" viewBox="0 0 860 416" role="img" aria-label="C2 for release 0.1: crates inside the embedder's process. The embedder or test calls Operations through LocalOperations in ironflowx-cell, the ledger, which implements ironflowx-proto, the Operations trait and messages. The ironflowx facade re-exports the four ironflowx crates. The ledger uses ironflowx-events, the pure event rules, which use ironflowx-core. The ledger writes through segment-log-core and rusqlite to the log and read store on disk." xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" fill="currentColor">
  <style>svg{color:#1b1b1b}.bg{fill:#ffffff}.band{fill:#f3f5f8}.pure{fill:#e8f1fb}.lib{fill:#f6efe6}.sub{opacity:.75}@media (prefers-color-scheme:dark){svg{color:#e6e6e6}.bg{fill:#16181d}.band{fill:#1f232b}.pure{fill:#18283a}.lib{fill:#2b241b}}</style>
  <rect class="bg" width="860" height="416" rx="8"/>
  <defs><marker id="a-c2-crates" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
  <text x="20" y="28" font-size="14" font-weight="600" text-anchor="start">C2 · Crates in the embedder's process, release 0.1</text>
  <rect class="band" x="20" y="44" width="820" height="330" rx="8"/>
  <text x="34" y="64" font-size="11" font-weight="600" text-anchor="start">embedder process</text>
  <rect x="60" y="76" width="200" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">Embedder / tests</text>
  <text x="160.0" y="112.0" text-anchor="middle" font-size="11">call Operations</text>
  <rect x="320" y="76" width="220" height="44" rx="5" fill="none" stroke="#2f7fd1" stroke-width="2"/>
  <text x="430.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-proto</text>
  <text x="430.0" y="112.0" text-anchor="middle" font-size="11">Operations trait and messages</text>
  <rect x="60" y="170" width="200" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
  <text x="160.0" y="195.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-cell</text>
  <text x="160.0" y="211.0" text-anchor="middle" font-size="11">Ledger, LocalOperations</text>
  <rect x="600" y="76" width="210" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="705.0" y="96.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx (facade)</text>
  <text x="705.0" y="112.0" text-anchor="middle" font-size="11">re-exports the four crates</text>
  <rect class="pure" x="320" y="170" width="220" height="54" rx="5"/>
  <rect x="320" y="170" width="220" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="195.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-events</text>
  <text x="430.0" y="211.0" text-anchor="middle" font-size="11">event rules: decide, fold, queries</text>
  <rect class="pure" x="600" y="170" width="210" height="54" rx="5"/>
  <rect x="600" y="170" width="210" height="54" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="705.0" y="188.0" text-anchor="middle" font-size="13" font-weight="600">ironflowx-core</text>
  <text x="705.0" y="204.0" text-anchor="middle" font-size="11">opaque IDs, EnvRef, Timestamp,</text>
  <text x="705.0" y="218.0" text-anchor="middle" font-size="11">Clock trait, errors</text>
  <rect class="lib" x="60" y="290" width="200" height="50" rx="5"/>
  <rect x="60" y="290" width="200" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="160.0" y="313.0" text-anchor="middle" font-size="13" font-weight="600">segment-log-core</text>
  <text x="160.0" y="329.0" text-anchor="middle" font-size="11">commit log (library)</text>
  <rect class="lib" x="320" y="290" width="220" height="50" rx="5"/>
  <rect x="320" y="290" width="220" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="430.0" y="313.0" text-anchor="middle" font-size="13" font-weight="600">rusqlite</text>
  <text x="430.0" y="329.0" text-anchor="middle" font-size="11">SQLite, bundled: read store</text>
  <path d="M260 98 H318" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 120 V168" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <text x="166" y="148" font-size="11" text-anchor="start">calls</text>
  <path d="M260 197 H318" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M540 197 H598" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M240 170 L360 122" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M160 224 V288" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M240 224 L380 288" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M430 120 L680 168" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <rect x="600" y="290" width="210" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705.0" y="319.0" text-anchor="middle" font-size="13" font-weight="600">disk: &lt;dir&gt;/log, &lt;dir&gt;/read.db</text>
  <path d="M260 315 H300 V360 H700 V342" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <path d="M540 315 H598" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#a-c2-crates)"/>
  <text x="20" y="400" font-size="11" text-anchor="start">Arrows point to what a crate depends on. Blue: the Operations seam. Shaded blue: pure crates, no I/O and no clock (layering check). Beige: libraries.</text>
</svg>
